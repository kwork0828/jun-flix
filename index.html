<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone - 현재 상영 영화</title>
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="netflix-header">
        <h1 class="logo">NETFLIX</h1>
        <div class="nav-links">
            <span class="nav-item">홈</span>
            <span class="nav-item">시리즈</span>
            <span class="nav-item">영화</span>
        </div>
    </header>

    <main>
        <section class="banner">
            <h2 class="banner-title">현재 상영 중인 영화</h2>
            <p class="banner-desc">최신 영화들을 확인해보세요.</p>
        </section>

        <section id="movie-container" class="movie-grid">
            <!-- JavaScript가 이곳에 영화 카드를 렌더링합니다 -->
        </section>
    </main>

    <!-- JavaScript 연결 -->
    <script src="app.js"></script>
</body>
</html>
